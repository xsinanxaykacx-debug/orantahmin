name: iddaa Günlük Veri Güncelleme

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update-iddaa.ts"
      - "scripts/iddaa/**"
      - "scripts/fotmob/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/iddaa-update.yml"

permissions:
  contents: write

concurrency:
  group: iddaa-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Node.js 24 kur
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Testleri çalıştır
        run: npm test
      - name: iddaa bültenini çek ve FotMob ile eşleştir
        run: npm run update:iddaa
      - name: Değişiklik varsa GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/football-bulletin.json public/data/fotmob-event-map.json data/raw/
          if git diff --cached --quiet; then
            echo "Yeni değişiklik yok."
          else
            git commit -m "chore: update daily iddaa and FotMob data"
            git push origin HEAD:main
          fi
