name: iddaa migration validation

on:
  push:
    branches:
      - feature/iddaa-source-migration
    paths:
      - "api/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/iddaa-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
