name: Maçkolik Günlük Veri Güncelleme

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mackolik-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node.js 24 kur
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıkları kur
        run: |
          npm ci
          npm install --no-save --package-lock=false json5

      - name: Maçkolik verisini çek ve JSON oluştur
        run: npm run update:mackolik

      - name: Değişiklik varsa GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/mackolik-bulletin.json data/raw/
          if git diff --cached --quiet; then
            echo "Yeni değişiklik yok."
          else
            git commit -m "chore: update daily Mackolik data"
            git push origin HEAD:main
          fi
